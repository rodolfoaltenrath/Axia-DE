[package]
name = "axia-shell"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Axia desktop policies, embedded in the C compositor"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
regex = "1"

[lib]
crate-type = ["staticlib", "rlib"]
