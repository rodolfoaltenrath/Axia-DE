[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Axia build and packaging commands; never installed with the desktop"
publish = false

[dependencies]
serde_json = "1"
regex = "1"
flate2 = "1"
axia-crypto = { path = "../axia-crypto" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
