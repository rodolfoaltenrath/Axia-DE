[package]
name = "axia-netperm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
path = "../../server/src/netperm/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "axia-netperm"
path = "../../server/src/netperm/main.rs"

[features]
default = []
bpf = []

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "npverify-test"
path = "../../server/src/netperm/verify.rs"
required-features = ["bpf"]
