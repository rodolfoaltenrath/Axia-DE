[package]
name = "axia-codecs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded Rust codecs for Axia and its sandboxed helpers"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["fonts"]
fonts = ["dep:fontdue", "dep:ttf-parser"]
# Only the vault executable may link this variant. All codec allocations,
# including decoder scratch buffers, then use its protected secrets arena.
secure-memory = []

[dependencies]
axia-crypto = { path = "../axia-crypto" }
libc = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
fontdue = { version = "0.9.5", default-features = false, features = ["std"], optional = true }
ttf-parser = { version = "0.25.1", optional = true }
