[workspace]
members = [
    "axia-app-about",
    "axia-app-appabout",
    "axia-app-backup",
    "axia-app-calculator",
    "axia-app-calendar",
    "axia-app-camera",
    "axia-app-characters",
    "axia-app-clock",
    "axia-app-contacts",
    "axia-app-files",
    "axia-app-fonts",
    "axia-app-forcequit",
    "axia-app-help",
    "axia-app-logs",
    "axia-app-monitor",
    "axia-app-notes",
    "axia-app-passwords",
    "axia-app-pdf",
    "axia-app-photos",
    "axia-app-recorder",
    "axia-app-reminders",
    "axia-app-scanner",
    "axia-app-settings",
    "axia-app-store",
    "axia-app-sysinfo",
    "axia-app-sysprobe",
    "axia-app-terminal",
    "axia-bench",
    "axia-clock",
    "axia-codecs",
    "axia-crypto",
    "axia-fs",
    "axia-mail",
    "axia-native",
    "axia-netperm",
    "axia-session",
    "axia-shell",
    "axia-state",
    "xtask",
]
# The compositor build compiles only the library; xtask is asked for by name.
default-members = ["axia-shell"]
resolver = "2"

[profile.release]
panic = "abort"
