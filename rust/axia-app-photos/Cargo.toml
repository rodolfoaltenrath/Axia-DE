[package]
name = "axia-app-photos"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axia-fs = { path = "../axia-fs" }
axia-native = { path = "../axia-native" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
