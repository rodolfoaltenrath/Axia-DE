[package]
name = "axia-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native desktop benchmark measurements, workloads and isolated helper"

[dependencies]
libc = "0.2"
serde_json = "1"
axia-crypto = { path = "../axia-crypto" }
axia-shell = { path = "../axia-shell", optional = true }
regex = "1"

[features]
gpu = []
native-host = ["dep:axia-shell"]

[lib]
path = "../../server/src/bench/mod.rs"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "lbcorpus"
path = "../../server/src/bench/corpus.rs"

[[bin]]
name = "axia-bench"
path = "../../server/src/bench/main.rs"
required-features = ["native-host"]

[[bin]]
name = "axia-profile-ui"
path = "../../server/tests/profile_ui.rs"
required-features = ["native-host"]
test = false
bench = false

[[bin]]
name = "lordbench-cli"
path = "../../server/src/bench/cli.rs"

[[test]]
name = "lordbench-native"
path = "../../server/tests/axia_bench.rs"
required-features = ["native-host"]
