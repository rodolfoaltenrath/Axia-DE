        run: |
          cargo xtask idle-check --installation "$RUNNER_TEMP/axia-de/usr/libexec/axia" --output "$RUNNER_TEMP/axia-idle/report.json" --max-polls-per-second "$AXIA_IDLE_MAX_POLLS" --max-rss-mib "$AXIA_IDLE_MAX_RSS_MIB" --enforce "$AXIA_IDLE_ENFORCE"
