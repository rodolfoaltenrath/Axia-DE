name: Standalone desktop (Fedora)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fedora-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime-memory:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [stacked, tree]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned memory checker
        run: rustup toolchain install nightly-2026-11-09 --profile minimal --component miri --component rust-src
      - name: Prepare Miri outside the vendored workspace
        working-directory: ${{ runner.temp }}
        run: cargo +nightly-2026-11-09 miri setup
      - name: Rust runtime memory contracts
        env:
          MIRIFLAGS: ${{ matrix.model == 'tree' && '-Zmiri-tree-borrows -Zmiri-strict-provenance' || '-Zmiri-strict-provenance' }}
        run: |
          cargo +nightly-2026-11-09 miri test --manifest-path rust/Cargo.toml --target-dir '${{ runner.temp }}/axia-runtime-miri' --locked --offline --lib runtime::
  desktop:
    env:
      CARGO_BUILD_JOBS: '2'
    strategy:
      matrix:
        gpu: [0, 1]
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          dnf install -y dnf5-plugins nodejs npm xdg-user-dirs dbus-daemon mesa-libgbm-devel mesa-libEGL-devel mesa-libGLES-devel clang strace
          dnf builddep -y packaging/rpm/axia-de.spec
      - run: npm ci
      - name: Rust LPK API compatibility contract
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test lpk_api -- --include-ignored
      - name: Desktop model regression tests
        run: |
          node server/tests/shortcut_profile_test.mjs
      - name: Rust observable state contracts
        if: matrix.gpu == 1
        run: cargo test --manifest-path rust/Cargo.toml --target-dir server/build/rust --locked --offline -p axia-state
      - name: Build and test desktop with memory telemetry
        env:
          AXIA_SHELL_SURFACES_OUTPUT: ${{ runner.temp }}/axia-shell-surfaces
        run: cargo xtask build-memory --output "$RUNNER_TEMP/desktop-memory.json" -- make -j2 check GPU=${{ matrix.gpu }} CFLAGS='-O2 -g -D_FORTIFY_SOURCE=3 -fstack-protector-strong'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-memory-${{ matrix.gpu }}
          path: ${{ runner.temp }}/desktop-memory.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axia-shell-surfaces-${{ matrix.gpu }}
          path: ${{ runner.temp }}/axia-shell-surfaces/
          if-no-files-found: warn
      - name: Rust installed shell shutdown regression
        env:
          AXIA_SHUTDOWN_OUTPUT: ${{ runner.temp }}/axia-shutdown
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test session_shutdown_runtime -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axia-shutdown-${{ matrix.gpu }}
          path: ${{ runner.temp }}/axia-shutdown/
          if-no-files-found: warn
      - name: Rust runtime ABI and renderer regressions
        if: matrix.gpu == 1
        run: |
          cargo test --manifest-path rust/Cargo.toml --target-dir server/build/rust --locked --offline runtime::tests::native_views_match_c_layout -- --ignored --nocapture
          make -C server build/engine-test GPU=1
      - name: Rust application menu integration
        if: matrix.gpu == 1
        run: cargo test --manifest-path rust/Cargo.toml --target-dir server/build/rust --locked --offline --test launcher_runtime -- --ignored --nocapture
      - name: Rust context menu integration and captures
        if: matrix.gpu == 1
        env:
          AXIA_MENUS_OUTPUT: ${{ runner.temp }}/axia-menus
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test menus_runtime -- --ignored --nocapture
      - name: Rust notification integration and captures
        if: matrix.gpu == 1
        env:
          AXIA_NOTIFICATIONS_OUTPUT: ${{ runner.temp }}/axia-notifications
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test notifications_runtime -- --ignored --nocapture
      - name: Rust native clock scheduling and status
        if: matrix.gpu == 1
        env:
          AXIA_NATIVE_CLOCK_OUTPUT: ${{ runner.temp }}/axia-native-clock
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test native_clock_runtime -- --ignored --nocapture
      - name: Rust Dock integration and captures
