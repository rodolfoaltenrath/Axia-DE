name: Standalone desktop (Fedora)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fedora-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime-memory:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [stacked, tree]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned memory checker
        run: rustup toolchain install nightly-2026-11-09 --profile minimal --component miri --component rust-src
      - name: Prepare Miri outside the vendored workspace
        working-directory: ${{ runner.temp }}
        run: cargo +nightly-2026-11-09 miri setup
      - name: Rust runtime memory contracts
        env:
          MIRIFLAGS: ${{ matrix.model == 'tree' && '-Zmiri-tree-borrows -Zmiri-strict-provenance' || '-Zmiri-strict-provenance' }}
        run: |
          cargo +nightly-2026-11-09 miri test --manifest-path rust/Cargo.toml --target-dir '${{ runner.temp }}/axia-runtime-miri' --locked --offline --lib runtime::
  desktop:
    env:
      CARGO_BUILD_JOBS: '2'
    strategy:
      matrix:
        gpu: [0, 1]
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          dnf install -y dnf5-plugins nodejs npm xdg-user-dirs dbus-daemon mesa-libgbm-devel mesa-libEGL-devel mesa-libGLES-devel clang strace
          dnf builddep -y packaging/rpm/axia-de.spec
      - run: npm ci
      - name: Rust LPK API compatibility contract
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test lpk_api -- --include-ignored
      - name: Desktop model regression tests
        run: |
          node server/tests/shortcut_profile_test.mjs
      - name: Rust observable state contracts
        if: matrix.gpu == 1
        run: cargo test --manifest-path rust/Cargo.toml --target-dir server/build/rust --locked --offline -p axia-state
      - name: Build and test desktop with memory telemetry
        env:
          AXIA_SHELL_SURFACES_OUTPUT: ${{ runner.temp }}/axia-shell-surfaces
        run: cargo xtask build-memory --output "$RUNNER_TEMP/desktop-memory.json" -- make -j2 check GPU=${{ matrix.gpu }} CFLAGS='-O2 -g -D_FORTIFY_SOURCE=3 -fstack-protector-strong'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-memory-${{ matrix.gpu }}
          path: ${{ runner.temp }}/desktop-memory.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axia-shell-surfaces-${{ matrix.gpu }}
          path: ${{ runner.temp }}/axia-shell-surfaces/
          if-no-files-found: warn
      - name: Rust installed shell shutdown regression
        env:
          AXIA_SHUTDOWN_OUTPUT: ${{ runner.temp }}/axia-shutdown
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test session_shutdown_runtime -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axia-shutdown-${{ matrix.gpu }}
          path: ${{ runner.temp }}/axia-shutdown/
          if-no-files-found: warn
      - name: Rust runtime ABI and renderer regressions
        if: matrix.gpu == 1
        run: |
          cargo test --manifest-path rust/Cargo.toml --target-dir server/build/rust --locked --offline runtime::tests::native_views_match_c_layout -- --ignored --nocapture
          make -C server build/engine-test GPU=1
      - name: Rust application menu integration
        if: matrix.gpu == 1
        run: cargo test --manifest-path rust/Cargo.toml --target-dir server/build/rust --locked --offline --test launcher_runtime -- --ignored --nocapture
      - name: Rust context menu integration and captures
        if: matrix.gpu == 1
        env:
          AXIA_MENUS_OUTPUT: ${{ runner.temp }}/axia-menus
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test menus_runtime -- --ignored --nocapture
      - name: Rust notification integration and captures
        if: matrix.gpu == 1
        env:
          AXIA_NOTIFICATIONS_OUTPUT: ${{ runner.temp }}/axia-notifications
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test notifications_runtime -- --ignored --nocapture
      - name: Rust native clock scheduling and status
        if: matrix.gpu == 1
        env:
          AXIA_NATIVE_CLOCK_OUTPUT: ${{ runner.temp }}/axia-native-clock
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test native_clock_runtime -- --ignored --nocapture
      - name: Rust Dock integration and captures
        if: matrix.gpu == 1
        env:
          AXIA_DOCK_OUTPUT: ${{ runner.temp }}/axia-dock
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test dock_runtime -- --ignored --nocapture
      - name: Rust native settings ownership and captures
        if: matrix.gpu == 1
        env:
          AXIA_NATIVE_SETTINGS_OUTPUT: ${{ runner.temp }}/axia-native-settings
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test native_settings_runtime -- --ignored --nocapture
      - name: Native locale ownership
        if: matrix.gpu == 1
        env:
          AXIA_NATIVE_LOCALE_OUTPUT: ${{ runner.temp }}/axia-native-locale
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test native_locale_runtime -- --ignored --nocapture
      - name: Rust Spotlight integration and captures
        if: matrix.gpu == 1
        env:
          AXIA_SPOTLIGHT_OUTPUT: ${{ runner.temp }}/axia-spotlight
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test spotlight_runtime -- --ignored --nocapture
      - name: Rust native launcher integration and captures
        if: matrix.gpu == 1
        env:
          AXIA_LAUNCHER_OUTPUT: ${{ runner.temp }}/axia-launcher
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test launcher_native_runtime -- --ignored --nocapture
      - name: Rust title bar integration and captures
        if: matrix.gpu == 1
        env:
          AXIA_TITLEBAR_AXIA_OUTPUT: ${{ runner.temp }}/axia-titlebar/axia
          AXIA_TITLEBAR_ADWAITA_OUTPUT: ${{ runner.temp }}/axia-titlebar/adwaita
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test titlebar_runtime -- --ignored --nocapture
      - name: Rust Files integration and captures
        if: matrix.gpu == 1
        env:
          AXIA_FILES_AXIA_OUTPUT: ${{ runner.temp }}/axia-files/axia
          AXIA_FILES_ADWAITA_OUTPUT: ${{ runner.temp }}/axia-files/adwaita
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test files_runtime -- --ignored --nocapture
      - name: Rust native focus integration and captures
        if: matrix.gpu == 1
        env:
          AXIA_NATIVE_FOCUS_OUTPUT: ${{ runner.temp }}/axia-native-focus
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test native_focus_runtime -- --ignored --nocapture
      - name: Rust native session restore and captures
        if: matrix.gpu == 1
        env:
          AXIA_SESSION_RESTORE_OUTPUT: ${{ runner.temp }}/axia-session-restore
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test session_restore_runtime -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-session-restore
          path: ${{ runner.temp }}/axia-session-restore/
          if-no-files-found: warn
      - name: Rust native remembered window places
        if: matrix.gpu == 1
        env:
          AXIA_WINDOW_MEMORY_OUTPUT: ${{ runner.temp }}/axia-window-memory
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test window_memory_runtime -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-window-memory
          path: ${{ runner.temp }}/axia-window-memory/
          if-no-files-found: warn
      - name: Rust native desktop animation and captures
        if: matrix.gpu == 1
        env:
          AXIA_DESKTOP_ANIMATION_OUTPUT: ${{ runner.temp }}/axia-desktop-animation
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test desktop_animation_runtime -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-desktop-animation
          path: ${{ runner.temp }}/axia-desktop-animation/
          if-no-files-found: warn
      - name: Rust native desktop indicator and captures
        if: matrix.gpu == 1
        env:
          AXIA_DESKTOP_HUD_OUTPUT: ${{ runner.temp }}/axia-desktop-hud
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test desktop_hud_runtime -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-desktop-hud
          path: ${{ runner.temp }}/axia-desktop-hud/
          if-no-files-found: warn
      - name: Rust native Window menu and captures
        if: matrix.gpu == 1
        env:
          AXIA_WINDOW_MENU_OUTPUT: ${{ runner.temp }}/axia-window-menu
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test window_menu_runtime -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-window-menu
          path: ${{ runner.temp }}/axia-window-menu/
          if-no-files-found: warn
      - name: Rust application menus and graceful quit
        if: matrix.gpu == 1
        env:
          AXIA_APP_MENUS_OUTPUT: ${{ runner.temp }}/axia-app-menus
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test app_menus_runtime -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-app-menus
          path: ${{ runner.temp }}/axia-app-menus/
          if-no-files-found: warn
      - name: Rust session window commands and captures
        if: matrix.gpu == 1
        env:
          AXIA_WINDOW_COMMANDS_OUTPUT: ${{ runner.temp }}/axia-window-commands
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test window_commands_runtime -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-window-commands
          path: ${{ runner.temp }}/axia-window-commands/
          if-no-files-found: warn
      - name: Rust native switcher integration and captures
        if: matrix.gpu == 1
        env:
          AXIA_SWITCHER_AXIA_OUTPUT: ${{ runner.temp }}/axia-switcher/axia
          AXIA_SWITCHER_ADWAITA_OUTPUT: ${{ runner.temp }}/axia-switcher/adwaita
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test switcher_runtime -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-switcher
          path: ${{ runner.temp }}/axia-switcher/
          if-no-files-found: warn
      - name: Rust Force Quit integration and captures
        if: matrix.gpu == 1
        env:
          AXIA_FORCEQUIT_OUTPUT: ${{ runner.temp }}/axia-forcequit
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test forcequit_runtime -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-forcequit
          path: ${{ runner.temp }}/axia-forcequit/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-native-focus
          path: ${{ runner.temp }}/axia-native-focus/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-files
          path: ${{ runner.temp }}/axia-files/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-titlebar
          path: ${{ runner.temp }}/axia-titlebar
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-launcher
          path: ${{ runner.temp }}/axia-launcher
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-spotlight
          path: ${{ runner.temp }}/axia-spotlight
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-dock
          path: ${{ runner.temp }}/axia-dock
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-notifications
          path: ${{ runner.temp }}/axia-notifications
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-native-clock
          path: ${{ runner.temp }}/axia-native-clock
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-native-settings
          path: ${{ runner.temp }}/axia-native-settings
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-native-locale
          path: ${{ runner.temp }}/axia-native-locale
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-menus
          path: ${{ runner.temp }}/axia-menus
          if-no-files-found: warn
      - name: Compiled Rust application integration
        if: matrix.gpu == 1
        run: cargo test --manifest-path rust/Cargo.toml --target-dir server/build/rust --locked --offline --test native_apps_runtime -- --ignored --nocapture
      - name: Rust resident search integration
        if: matrix.gpu == 1
        run: cargo test --manifest-path rust/Cargo.toml --target-dir server/build/rust --locked --offline --test search_runtime -- --ignored --nocapture
      - name: Rust native clipboard XWayland integration
        if: matrix.gpu == 1
        run: |
          dnf install -y --setopt=install_weak_deps=False xorg-x11-server-Xwayland libX11-devel
          python3 tools/desktop/clipboard_x11_check.py
      - name: Rust network, brightness and background-app contracts
        if: matrix.gpu == 1
        run: |
          dnf install -y python3-gobject-base dbus-daemon
          dbus-run-session -- python3 tools/desktop/network-tray-check.py
      - name: Touchpad regression tests
        run: |
          make -C server build/tp-test
          server/build/tp-test
      - name: Rust build partition tests
        run: cargo test --manifest-path rust/Cargo.toml -p xtask --locked --offline --test build_partition -- --include-ignored
      - name: Remaining Python packaging tests
        run: python3 -m unittest discover -s tools/desktop/tests -v
      - name: Rust session root startup guard
        run: cargo test --manifest-path rust/Cargo.toml -p axia-session --locked --offline --test session both_entrypoints_reject_root_before_starting_a_compositor -- --ignored
      - name: Stage installation
        run: make install PREFIX=/usr DESTDIR="$RUNNER_TEMP/axia-de"
      - name: Rust installed session integration
        if: matrix.gpu == 1
        env:
          AXIA_SESSION_TEST_STAGE: ${{ runner.temp }}/axia-de/usr/libexec/axia
          AXIA_SESSION_TEST_OUTPUT: ${{ runner.temp }}/axia-session
        run: cargo test --manifest-path rust/Cargo.toml -p axia-session --locked --offline --test installed -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-session
          path: ${{ runner.temp }}/axia-session
          if-no-files-found: warn
      - name: Verify private session idle budgets
        if: matrix.gpu == 1
        env:
          AXIA_IDLE_ENFORCE: ${{ vars.AXIA_IDLE_ENFORCE || 'true' }}
          AXIA_IDLE_MAX_POLLS: ${{ vars.AXIA_IDLE_MAX_POLLS || '15' }}
          AXIA_IDLE_MAX_RSS_MIB: ${{ vars.AXIA_IDLE_MAX_RSS_MIB || '120' }}
        run: |
          cargo xtask idle-check --installation "$RUNNER_TEMP/axia-de/usr/libexec/axia" --output "$RUNNER_TEMP/axia-idle/report.json" --max-polls-per-second "$AXIA_IDLE_MAX_POLLS" --max-rss-mib "$AXIA_IDLE_MAX_RSS_MIB" --enforce "$AXIA_IDLE_ENFORCE"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gpu == 1
        with:
          name: axia-idle
          path: ${{ runner.temp }}/axia-idle/
          if-no-files-found: warn
  rpm:
    needs: [desktop, runtime-memory]
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@v4
      - name: Trust the checked-out workspace in the build container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: RPM build dependencies
        run: |
          dnf install -y dnf5-plugins rpm-build nodejs npm
          dnf builddep -y packaging/rpm/axia-de.spec
      - name: Build source RPM
        run: cargo xtask srpm --outdir "$GITHUB_WORKSPACE/build/srpm"
      - name: Build and check the binary RPM
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/rpmbuild"
          cargo xtask build-memory --output "$RUNNER_TEMP/rpm-memory.json" -- rpmbuild --rebuild --define "_topdir $GITHUB_WORKSPACE/build/rpmbuild" build/srpm/*.src.rpm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpm-memory
          path: ${{ runner.temp }}/rpm-memory.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: axia-de-fedora-44
          path: |
            build/srpm/*.src.rpm
            build/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 14
  copr:
    needs: rpm
    # Enable with a repository variable after the Copr project exists. Pull
    # requests never receive publication credentials. SCM webhooks are optional;
    # this job submits exactly the SRPM which passed the preceding checks.
    if: >-
      vars.COPR_PROJECT != '' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    concurrency:
      group: copr-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - run: dnf install -y git copr-cli
      - uses: actions/checkout@v4
      - name: Copr submission and polling regression tests
        run: python3 -m unittest discover -s tools/desktop/tests -p test_copr_publish.py -v
      - uses: actions/download-artifact@v4
        with:
          name: axia-de-fedora-44
          path: packages
      - name: Submit the checked source RPM to Copr
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
        run: python3 tools/desktop/copr_publish.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copr-build
          path: build/copr/build.json
          if-no-files-found: ignore
